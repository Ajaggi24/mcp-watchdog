[project]
name = "mcp-watchdog"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Pause MCP tools whose definitions changed after you approved them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "anyio>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpwatchdog = "mcpwatchdog.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcpwatchdog"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
